alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(latency_ms) > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-02748
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 5
    duration: 2m
    type: symptom-based
    channel: slack
    owner: student-02748
    runbook: docs/alerts.md#alert-2
  - name: RetrievalFailureRate
    severity: warning
    condition: retrieval_success_rate_pct < 90
    duration: 3m
    type: symptom-based
    channel: slack
    owner: student-02748
    runbook: docs/alerts.md#alert-3
